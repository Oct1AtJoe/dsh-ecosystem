<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kanye Pet</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: transparent;
  cursor: default;
}
#pet {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  cursor: grab;
}
#pet-bubble {
  position: fixed;
  bottom: 4px;
  left: 4px;
  right: 4px;
  width: auto;
  transform: none;
  background: rgba(8, 10, 16, 0.94);
  border: 1px solid rgba(0, 188, 212, 0.5);
  border-radius: 4px;
  padding: 4px 6px;
  min-width: 0;
  max-width: none;
  max-height: 54px;
  flex-direction: column;
  gap: 1px;
  cursor: pointer;
  z-index: 100;
  pointer-events: auto;
  -webkit-app-region: no-drag;
  box-shadow: 0 0 6px rgba(0, 188, 212, 0.15), inset 0 1px 0 rgba(0, 188, 212, 0.08);
  overflow: hidden;
}
#pet-bubble::before {
  content: '';
  position: absolute;
  top: 0; left: 14px; right: 14px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0, 188, 212, 0.6), transparent);
}
#pet-bubble strong {
  font-size: 14px;
  color: #e0f7fa;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.3px;
  flex-shrink: 0;
}
#pet-bubble span {
  font-size: 12.5px;
  color: rgba(178, 235, 242, 0.7);
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex-shrink: 0;
}
</style>
</head>
<body>
<div id="pet"></div>
<script src="pet.js"></script>
</body>
</html>
