<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>DeepSeek Harness</title>
    <style>
      /* 壳页面：只画标题栏那一条。DSH 内容在同一个窗口的 content 子 WebView 里，
         本页永不导航，所以标题栏不会随 DSH 页面刷新消失或闪动。
         动作统一走 Tauri IPC（本地受信页面，窗口权限已在 capabilities 声明）；
         下拉菜单是原生弹出菜单（HTML 浮层出不了 36px）。 */
      :root {
        --dsh-titlebar-height: 36px;
        --bg: #0d1117;
        --line: rgba(255, 255, 255, 0.09);
        --text: #c9d1d9;
        --muted: #8b949e;
        --hover: rgba(255, 255, 255, 0.08);
        --active: rgba(88, 166, 255, 0.18);
        --accent: #58a6ff;
        --close-hover: #e81123;
      }
      /* 浅色兜底：只在显式 light 类时生效。
         注意：绝不能用 body:not(.dark) —— 它几乎永远匹配，且定义在 body 上的
         --bg 会覆盖 html 的内联主题变量，导致自定义主题被刷回默认白。 */
      :root.light, html.light, body.light {
        --bg: #f6f8fa;
        --line: rgba(0, 0, 0, 0.09);
        --text: #24292f;
        --muted: #57606a;
        --hover: rgba(0, 0, 0, 0.06);
        --active: rgba(9, 105, 218, 0.1);
        --accent: #0969da;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        transition: background-color 0.25s, color 0.25s;
      }
      #titlebar {
        height: var(--dsh-titlebar-height);
        display: flex;
        align-items: stretch;
        background: var(--bg);
        user-select: none;
        -webkit-user-select: none;
        transition: background-color 0.2s;
      }
      .drag {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        padding: 0 12px;
        cursor: default;
      }
      .drag .mark {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        object-fit: contain;
        pointer-events: none;
      }
      .drag span {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
      }
      .actions { display: flex; align-items: stretch; flex: 0 0 auto; }
      button.tb {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--muted);
        width: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        outline: none;
        transition: background-color 0.15s, color 0.15s;
      }
      button.tb:hover { background: var(--hover); color: var(--text); }
      button.tb.close:hover { background: var(--close-hover); color: #fff; }
      button.tb.menu { width: 38px; }
      button.tb.menu:hover, button.tb.menu.active { background: var(--active); color: var(--accent); }
    </style>
  </head>
  <body class="dark">
    <script>
      // 首帧前落主题底色（body 已存在，可安全写 body 内联变量）。
      // 关键：必须同时写 html 与 body —— 浅色兜底调色板定义在 body.light 上，
      // body 上的 --bg 会覆盖 html 的内联值，只写 html 会被默认白盖掉。
      try {
        if (localStorage.getItem('dsh-shell-theme') === 'light') {
          document.documentElement.classList.add('light');
          document.body.classList.add('light');
          document.body.classList.remove('dark');
        }
        var tbStr = localStorage.getItem('dsh-shell-titlebar-data');
        if (tbStr) {
          var tb = JSON.parse(tbStr);
          var targets = [document.documentElement, document.body];
          var write = function (k, v) {
            for (var i = 0; i < targets.length; i++) targets[i].style.setProperty(k, v);
          };
          if (tb.bg) write('--bg', tb.bg);
          if (tb.accent) write('--accent', tb.accent);
          if (tb.line) write('--line', tb.line);
          if (tb.text) write('--text', tb.text);
          if (tb.muted) write('--muted', tb.muted);
          if (tb.hover) write('--hover', tb.hover);
          if (tb.active) write('--active', tb.active);
        }
      } catch (e) { /* localStorage 不可用时保持默认深色 */ }
    </script>
    <header id="titlebar">
      <div class="drag" id="drag">
        <img class="mark" src="icon.png" alt="DeepSeek Harness" />
        <span>DeepSeek Harness</span>
      </div>
      <div class="actions">
        <button class="tb menu" id="menu-btn" type="button" title="主菜单">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <path d="M3 4.5h10M3 8h10M3 11.5h10"/>
          </svg>
        </button>
        <button class="tb" id="min-btn" type="button" title="最小化">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="8" width="10" height="1.2" rx="0.6"/></svg>
        </button>
        <button class="tb" id="max-btn" type="button" title="最大化">
          <svg id="max-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="3" y="3" width="10" height="10" rx="1"/>
          </svg>
        </button>
        <button class="tb close" id="close-btn" type="button" title="关闭（隐藏至托盘）">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
            <path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/>
          </svg>
        </button>
      </div>
    </header>

    <script>
      // 壳页面动作统一走 Tauri IPC（window.__TAURI__）。壳页面是本地受信页面，
      // 窗口权限已在 capabilities/default.json 里声明；相比跨源 fetch 通知桥更稳。
      var current = window.__TAURI__ && window.__TAURI__.window && window.__TAURI__.window.getCurrentWindow();
      var invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;

      function updateMaxIcon(isMax) {
        var icon = document.getElementById('max-icon');
        var maxBtn = document.getElementById('max-btn');
        if (!icon) return;
        icon.innerHTML = isMax
          ? '<path d="M5.5 3.5h7v7" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="3.5" y="5.5" width="7" height="7" rx="0.5" stroke="currentColor" stroke-width="1.2" fill="none"/>'
          : '<rect x="3" y="3" width="10" height="10" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/>';
        if (maxBtn) maxBtn.title = isMax ? '还原' : '最大化';
      }

      function syncMaxState() {
        if (!current) return;
        current.isMaximized().then(updateMaxIcon).catch(function () {});
      }

      // 初始化立即核对一次最大化状态，并监听窗口 resize 自动对齐
      syncMaxState();
      window.addEventListener('resize', syncMaxState);

      var menuBtn = document.getElementById('menu-btn');
      menuBtn.addEventListener('click', function () {
        menuBtn.classList.add('active');
        if (invoke) {
          // 原生菜单是模态消息循环：invoke 在菜单关闭后才 resolve，正好收起高亮
          invoke('show_shell_menu').then(function () { menuBtn.classList.remove('active'); });
        } else {
          menuBtn.classList.remove('active');
        }
      });

      document.getElementById('min-btn').addEventListener('click', function () {
        if (current) current.minimize().catch(function () {});
      });

      document.getElementById('max-btn').addEventListener('click', function () {
        if (!current) return;
        current.toggleMaximize().then(syncMaxState).catch(function () {});
        setTimeout(syncMaxState, 50);
        setTimeout(syncMaxState, 200);
      });

      document.getElementById('close-btn').addEventListener('click', function () {
        if (current) current.close().catch(function () {});
      });

      // 拖拽与双击最大化：单次点击拖拽交给系统（startDragging），双击（detail === 2）切换最大化
      var drag = document.getElementById('drag');
      drag.addEventListener('mousedown', function (e) {
        if (e.button !== 0 || !current) return;
        if (e.detail === 2) {
          current.toggleMaximize().then(syncMaxState).catch(function () {});
          setTimeout(syncMaxState, 50);
          setTimeout(syncMaxState, 200);
          return;
        }
        current.startDragging().catch(function () {});
      });

      // DSH 主题变化时由 Rust eval 进来
      window.__dshSetTheme = function (payload) {
        var isDark = typeof payload === 'boolean' ? payload : (payload && payload.theme === 'dark');
        document.body.classList.toggle('dark', !!isDark);
        document.body.classList.toggle('light', !isDark);
        document.documentElement.classList.toggle('dark', !!isDark);
        document.documentElement.classList.toggle('light', !isDark);

        var root = document.documentElement;
        var bodyEl = document.body;
        var targets = [root, bodyEl];
        var write = function (k, v) {
          for (var i = 0; i < targets.length; i++) targets[i].style.setProperty(k, v);
        };
        var clear = function (k) {
          for (var i = 0; i < targets.length; i++) targets[i].style.removeProperty(k);
        };
        // titlebar 三态语义：
        //   undefined —— 桥的 DOM 观察者旁路上报（只关心深浅），保持壳当前顶栏配色不动；
        //   null      —— 用户显式切回内置 light/dark，清除内联变量回退默认调色板；
        //   对象      —— 自定义主题，写入该主题的顶栏纯实色。
        var tb = payload && payload.titlebar;
        if (tb === null) {
          clear('--bg');
          clear('--accent');
          clear('--line');
          clear('--text');
          clear('--muted');
          clear('--hover');
          clear('--active');
          try {
            localStorage.removeItem('dsh-shell-titlebar-data');
            localStorage.setItem('dsh-shell-theme', isDark ? 'dark' : 'light');
          } catch (e) {}
        } else if (tb) {
          if (tb.bg) write('--bg', tb.bg);
          if (tb.accent) write('--accent', tb.accent);
          if (tb.line) write('--line', tb.line);
          if (tb.text) write('--text', tb.text);
          if (tb.muted) write('--muted', tb.muted);
          if (tb.hover) write('--hover', tb.hover);
          if (tb.active) write('--active', tb.active);
          try {
            localStorage.setItem('dsh-shell-titlebar-data', JSON.stringify(tb));
            localStorage.setItem('dsh-shell-theme', isDark ? 'dark' : 'light');
          } catch (e) {}
        } else {
          // 观察者旁路：仅更新深浅记忆，顶栏配色保持不动
          try { localStorage.setItem('dsh-shell-theme', isDark ? 'dark' : 'light'); } catch (e) {}
        }
      };
    </script>
  </body>
</html>
