<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>DeepSeek Harness</title>
    <style>
      /* 壳页面：只画标题栏那一条。DSH 内容在同一个窗口的 content 子 WebView 里，
         本页永不导航，所以标题栏不会随 DSH 页面刷新消失或闪动。
         注意：下拉菜单必须走原生弹出菜单——HTML 浮层出不了这条 36px。 */
      :root {
        --dsh-titlebar-height: 36px;
        --bg: #0d1117;
        --line: rgba(255, 255, 255, 0.09);
        --text: #c9d1d9;
        --muted: #8b949e;
        --hover: rgba(255, 255, 255, 0.08);
        --active: rgba(88, 166, 255, 0.18);
        --accent: #58a6ff;
        --close-hover: #e81123;
      }
      body:not(.dark) {
        --bg: #f6f8fa;
        --line: rgba(0, 0, 0, 0.09);
        --text: #24292f;
        --muted: #57606a;
        --hover: rgba(0, 0, 0, 0.06);
        --active: rgba(9, 105, 218, 0.1);
        --accent: #0969da;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      #titlebar {
        height: var(--dsh-titlebar-height);
        display: flex;
        align-items: stretch;
        border-bottom: 1px solid var(--line);
        user-select: none;
        -webkit-user-select: none;
      }
      .drag {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        padding: 0 12px;
        cursor: default;
      }
      .drag svg { width: 16px; height: 16px; flex: 0 0 auto; pointer-events: none; }
      .drag span {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
      }
      .actions { display: flex; align-items: stretch; flex: 0 0 auto; }
      button.tb {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--muted);
        width: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        outline: none;
        transition: background-color 0.15s, color 0.15s;
      }
      button.tb:hover { background: var(--hover); color: var(--text); }
      button.tb.close:hover { background: var(--close-hover); color: #fff; }
      button.tb.menu { width: 38px; }
      button.tb.menu:hover, button.tb.menu.active { background: var(--active); color: var(--accent); }
    </style>
  </head>
  <body class="dark">
    <header id="titlebar">
      <div class="drag" id="drag">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Dsh@Oct1AtJoe</span>
      </div>
      <div class="actions">
        <button class="tb menu" id="menu-btn" type="button" title="主菜单">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <path d="M3 4.5h10M3 8h10M3 11.5h10"/>
          </svg>
        </button>
        <button class="tb" id="min-btn" type="button" title="最小化">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="8" width="10" height="1.2" rx="0.6"/></svg>
        </button>
        <button class="tb" id="max-btn" type="button" title="最大化">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect id="max-icon" x="3" y="3" width="10" height="10" rx="1"/>
          </svg>
        </button>
        <button class="tb close" id="close-btn" type="button" title="关闭（隐藏至托盘）">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
            <path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/>
          </svg>
        </button>
      </div>
    </header>

    <script>
      // 壳侧动作统一走本地通知桥（POST /notify + Bearer token），不依赖 Tauri IPC 白名单；
      // port/token 由 Rust 通过 initialization_script 注入到本页。
      function send(action, data) {
        var bridge = window.__dshShellBridge;
        if (!bridge) return Promise.resolve({});
        var payload = Object.assign({ type: 'titlebar-action', action: action }, data || {});
        return fetch('http://127.0.0.1:' + bridge.port + '/notify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + bridge.token },
          body: JSON.stringify(payload)
        }).then(function (r) { return r.json(); }).catch(function () { return {}; });
      }

      var menuBtn = document.getElementById('menu-btn');
      menuBtn.addEventListener('click', function () {
        menuBtn.classList.add('active');
        // 原生菜单是模态消息循环：promise 在菜单关闭后才 resolve，正好用来收起高亮
        send('open_menu').then(function () { menuBtn.classList.remove('active'); });
      });

      document.getElementById('min-btn').addEventListener('click', function () { send('minimize'); });

      var maxIcon = document.getElementById('max-icon');
      var maxBtn = document.getElementById('max-btn');
      function setMaxIcon(isMax) {
        maxIcon.innerHTML = isMax
          ? '<path d="M5.5 3.5h7v7" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="3.5" y="5.5" width="7" height="7" rx="0.5" stroke="currentColor" stroke-width="1.2" fill="none"/>'
          : '<rect x="3" y="3" width="10" height="10" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/>';
        maxBtn.title = isMax ? '还原' : '最大化';
      }
      maxBtn.addEventListener('click', function () {
        send('toggle_maximize').then(function (res) {
          if (res && res.isMaximized !== undefined) setMaxIcon(res.isMaximized);
        });
      });

      document.getElementById('close-btn').addEventListener('click', function () { send('close'); });

      // 拖拽交给 Rust 的 start_dragging（不依赖 data-tauri-drag-region 的白名单）
      var drag = document.getElementById('drag');
      drag.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        send('start_drag');
      });
      drag.addEventListener('dblclick', function () {
        send('toggle_maximize').then(function (res) {
          if (res && res.isMaximized !== undefined) setMaxIcon(res.isMaximized);
        });
      });

      // DSH 主题变化时由 Rust eval 进来
      window.__dshSetTheme = function (isDark) {
        document.body.classList.toggle('dark', !!isDark);
      };
    </script>
  </body>
</html>
