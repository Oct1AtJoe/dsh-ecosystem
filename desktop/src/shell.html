<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>DeepSeek Harness</title>
    <style>
      /* 壳页面：只画标题栏那一条。DSH 内容在同一个窗口的 content 子 WebView 里，
         本页永不导航，所以标题栏不会随 DSH 页面刷新消失或闪动。
         动作统一走 Tauri IPC（本地受信页面，窗口权限已在 capabilities 声明）；
         下拉菜单是原生弹出菜单（HTML 浮层出不了 36px）。 */
      :root {
        --dsh-titlebar-height: 52px;
        --bg: #0d1117;
        --line: rgba(255, 255, 255, 0.09);
        --text: #c9d1d9;
        --muted: #8b949e;
        --hover: rgba(255, 255, 255, 0.08);
        --active: rgba(88, 166, 255, 0.18);
        --accent: #58a6ff;
        --close-hover: #e81123;
      }
      /* 浅色兜底：只在显式 light 类时生效。
         注意：绝不能用 body:not(.dark) —— 它几乎永远匹配，且定义在 body 上的
         --bg 会覆盖 html 的内联主题变量，导致自定义主题被刷回默认白。 */
      :root.light, html.light, body.light {
        --bg: #f6f8fa;
        --line: rgba(0, 0, 0, 0.09);
        --text: #24292f;
        --muted: #57606a;
        --hover: rgba(0, 0, 0, 0.06);
        --active: rgba(9, 105, 218, 0.1);
        --accent: #0969da;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Segoe UI", sans-serif;
        transition: background-color 0.25s, color 0.25s;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #titlebar {
        height: var(--dsh-titlebar-height);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(32px) saturate(190%);
        -webkit-backdrop-filter: blur(32px) saturate(190%);
        user-select: none;
        -webkit-user-select: none;
        transition: background-color 0.2s, border-color 0.2s;
        padding: 0 18px;
        position: relative;
        cursor: default;
      }
      body.light #titlebar {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.15) 100%),
          var(--bg);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.95), inset 0 -1px 0 rgba(0, 0, 0, 0.05);
      }
      body.dark #titlebar {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.01) 100%),
          var(--bg);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.18), inset 0 -1px 0 rgba(0, 0, 0, 0.35);
      }

      /* macOS 原生交通灯 (Traffic Lights) - 固定宽度 74px 对称基准 */
      .traffic-lights {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 74px;
        z-index: 2;
      }
      .traffic-btn {
        appearance: none;
        border: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        position: relative;
        cursor: pointer;
        padding: 0;
        outline: none;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.45), 0 1px 2px rgba(0, 0, 0, 0.22);
        transition: filter 0.15s, transform 0.1s;
      }
      .traffic-btn:active {
        transform: scale(0.92);
        filter: brightness(0.9);
      }
      .traffic-btn.close {
        background: #ff5f56;
        border: 0.5px solid #e0443e;
      }
      .traffic-btn.min {
        background: #ffbd2e;
        border: 0.5px solid #dea123;
      }
      .traffic-btn.max {
        background: #27c93f;
        border: 0.5px solid #1aab29;
      }

      /* Hover 时整组浮现 macOS 原生极细字符 */
      .traffic-lights:hover .traffic-btn.close::after {
        content: "×";
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 10px;
        line-height: 1;
        font-weight: 800;
        color: #4d0000;
        position: absolute;
        top: -0.5px;
      }
      .traffic-lights:hover .traffic-btn.min::after {
        content: "–";
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 9px;
        line-height: 1;
        font-weight: 900;
        color: #5c3b00;
        position: absolute;
        top: -0.5px;
      }
      .traffic-lights:hover .traffic-btn.max::after {
        content: "+";
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 9px;
        line-height: 1;
        font-weight: 900;
        color: #004d1a;
        position: absolute;
        top: -0.5px;
      }

      /* 中间绝对几何中心拖拽区 */
      .drag {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 100%;
        cursor: default;
        pointer-events: none; /* 穿透至 #titlebar，全栏顺畅拖拽 */
      }
      .drag .mark {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
        object-fit: contain;
      }
      .drag .title-text {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--text);
        line-height: 1;
      }

      /* 右侧功能按钮 - 同样固定 74px，保证中间标题绝对居中 */
      .right-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex: 0 0 74px;
        z-index: 2;
      }
      button.tb.menu {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--muted);
        width: 36px;
        height: 34px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        outline: none;
        transition: background-color 0.15s, color 0.15s;
      }
      button.tb.menu svg {
        width: 20px;
        height: 20px;
      }
      button.tb.menu:hover, button.tb.menu.active {
        background: var(--hover);
        color: var(--text);
      }
    </style>
  </head>
  <body class="dark">
    <script>
      // 首帧前落主题底色（body 已存在，可安全写 body 内联变量）。
      // 关键：必须同时写 html 与 body —— 浅色兜底调色板定义在 body.light 上，
      // body 上的 --bg 会覆盖 html 的内联值，只写 html 会被默认白盖掉。
      try {
        if (localStorage.getItem('dsh-shell-theme') === 'light') {
          document.documentElement.classList.add('light');
          document.body.classList.add('light');
          document.body.classList.remove('dark');
        }
        var tbStr = localStorage.getItem('dsh-shell-titlebar-data');
        if (tbStr) {
          var tb = JSON.parse(tbStr);
          var targets = [document.documentElement, document.body];
          var write = function (k, v) {
            for (var i = 0; i < targets.length; i++) targets[i].style.setProperty(k, v);
          };
          if (tb.bg) write('--bg', tb.bg);
          if (tb.accent) write('--accent', tb.accent);
          if (tb.line) write('--line', tb.line);
          if (tb.text) write('--text', tb.text);
          if (tb.muted) write('--muted', tb.muted);
          if (tb.hover) write('--hover', tb.hover);
          if (tb.active) write('--active', tb.active);
        }
      } catch (e) { /* localStorage 不可用时保持默认深色 */ }
    </script>
    <header id="titlebar">
      <div class="traffic-lights" id="traffic-lights">
        <button class="traffic-btn close" id="close-btn" type="button" title="关闭（隐藏至托盘）"></button>
        <button class="traffic-btn min" id="min-btn" type="button" title="最小化"></button>
        <button class="traffic-btn max" id="max-btn" type="button" title="最大化"></button>
      </div>
      <div class="drag" id="drag">
        <img class="mark" src="icon.png" alt="DeepSeek Harness" />
        <span class="title-text">DeepSeek Harness</span>
      </div>
      <div class="right-actions">
        <button class="tb menu" id="menu-btn" type="button" title="主菜单">
          <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <path d="M3 4.5h10M3 8h10M3 11.5h10"/>
          </svg>
        </button>
      </div>
    </header>

    <script>
      // 壳页面动作统一走 Tauri IPC（window.__TAURI__）。壳页面是本地受信页面，
      // 窗口权限已在 capabilities/default.json 里声明；相比跨源 fetch 通知桥更稳。
      var current = window.__TAURI__ && window.__TAURI__.window && window.__TAURI__.window.getCurrentWindow();
      var invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;

      function updateMaxIcon(isMax) {
        var maxBtn = document.getElementById('max-btn');
        if (maxBtn) maxBtn.title = isMax ? '还原' : '全屏缩放';
      }

      function syncMaxState() {
        if (!current) return;
        current.isMaximized().then(updateMaxIcon).catch(function () {});
      }

      // 初始化立即核对一次最大化状态，并监听窗口 resize 自动对齐
      syncMaxState();
      window.addEventListener('resize', syncMaxState);

      var menuBtn = document.getElementById('menu-btn');
      menuBtn.addEventListener('click', function () {
        menuBtn.classList.add('active');
        if (invoke) {
          // 原生菜单是模态消息循环：invoke 在菜单关闭后才 resolve，正好收起高亮
          invoke('show_shell_menu').then(function () { menuBtn.classList.remove('active'); });
        } else {
          menuBtn.classList.remove('active');
        }
      });

      document.getElementById('min-btn').addEventListener('click', function () {
        if (current) current.minimize().catch(function () {});
      });

      document.getElementById('max-btn').addEventListener('click', function () {
        if (!current) return;
        current.toggleMaximize().then(syncMaxState).catch(function () {});
        setTimeout(syncMaxState, 50);
        setTimeout(syncMaxState, 200);
      });

      document.getElementById('close-btn').addEventListener('click', function () {
        if (current) current.close().catch(function () {});
      });

      // 全栏自由拖拽与双击最大化：点击非按钮区域直接拖拽，双击切换最大化
      var titlebar = document.getElementById('titlebar');
      titlebar.addEventListener('mousedown', function (e) {
        if (e.button !== 0 || !current) return;
        if (e.target.closest('button')) return;
        if (e.detail === 2) {
          current.toggleMaximize().then(syncMaxState).catch(function () {});
          setTimeout(syncMaxState, 50);
          setTimeout(syncMaxState, 200);
          return;
        }
        current.startDragging().catch(function () {});
      });

      // DSH 主题变化时由 Rust eval 进来
      window.__dshSetTheme = function (payload) {
        var isDark = typeof payload === 'boolean' ? payload : (payload && payload.theme === 'dark');
        document.body.classList.toggle('dark', !!isDark);
        document.body.classList.toggle('light', !isDark);
        document.documentElement.classList.toggle('dark', !!isDark);
        document.documentElement.classList.toggle('light', !isDark);

        var root = document.documentElement;
        var bodyEl = document.body;
        var targets = [root, bodyEl];
        var write = function (k, v) {
          for (var i = 0; i < targets.length; i++) targets[i].style.setProperty(k, v);
        };
        var clear = function (k) {
          for (var i = 0; i < targets.length; i++) targets[i].style.removeProperty(k);
        };
        // titlebar 三态语义：
        //   undefined —— 桥的 DOM 观察者旁路上报（只关心深浅），保持壳当前顶栏配色不动；
        //   null      —— 用户显式切回内置 light/dark，清除内联变量回退默认调色板；
        //   对象      —— 自定义主题，写入该主题的顶栏纯实色。
        var tb = payload && payload.titlebar;
        if (tb === null) {
          clear('--bg');
          clear('--accent');
          clear('--line');
          clear('--text');
          clear('--muted');
          clear('--hover');
          clear('--active');
          try {
            localStorage.removeItem('dsh-shell-titlebar-data');
            localStorage.setItem('dsh-shell-theme', isDark ? 'dark' : 'light');
          } catch (e) {}
        } else if (tb) {
          if (tb.bg) write('--bg', tb.bg);
          if (tb.accent) write('--accent', tb.accent);
          if (tb.line) write('--line', tb.line);
          if (tb.text) write('--text', tb.text);
          if (tb.muted) write('--muted', tb.muted);
          if (tb.hover) write('--hover', tb.hover);
          if (tb.active) write('--active', tb.active);
          try {
            localStorage.setItem('dsh-shell-titlebar-data', JSON.stringify(tb));
            localStorage.setItem('dsh-shell-theme', isDark ? 'dark' : 'light');
          } catch (e) {}
        } else {
          // 观察者旁路：仅更新深浅记忆，顶栏配色保持不动
          try { localStorage.setItem('dsh-shell-theme', isDark ? 'dark' : 'light'); } catch (e) {}
        }
      };
    </script>
  </body>
</html>
